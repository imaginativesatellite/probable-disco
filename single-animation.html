<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Single Animation Test | Lunamations</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      color: #888;
      margin-bottom: 48px;
      line-height: 1.6;
    }

    button {
      font-size: 16px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: #f0f0f0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #161616;
      border-color: #f26522;
      color: #f26522;
    }

    .status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 12px;
    }

    .hamburger-btn:hover {
      opacity: 0.8;
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: rotate(45deg) translateY(11px);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: rotate(-45deg) translateY(-11px);
    }

    .menu-overlay.active {
      display: flex;
      opacity: 1;
    }

    .menu-overlay a:hover {
      color: #6c63ff;
    }
  </style>
</head>
<body>

<!-- Logo -->
<a href="index.html" class="logo" style="position: fixed; top: 24px; left: 24px; z-index: 1001; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #f0f0f0; text-decoration: none;">LUNAMATIONS</a>

<!-- Hamburger Menu Button -->
<button class="hamburger-btn" id="hamburger-btn" style="position: fixed; top: 24px; right: 24px; width: 48px; height: 48px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; z-index: 1001; transition: all 0.3s ease; padding: 0;">
  <span style="width: 24px; height: 2px; background: #f0f0f0; border-radius: 1px; transition: all 0.3s ease; display: block; transform-origin: center;"></span>
  <span style="width: 24px; height: 2px; background: #f0f0f0; border-radius: 1px; transition: all 0.3s ease; display: block; transform-origin: center;"></span>
  <span style="width: 24px; height: 2px; background: #f0f0f0; border-radius: 1px; transition: all 0.3s ease; display: block; transform-origin: center;"></span>
</button>

<!-- Full-Screen Menu Overlay -->
<div class="menu-overlay" id="menu-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14, 14, 14, 0.98); backdrop-filter: blur(10px); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
  <ul style="list-style: none; text-align: center;">
    <li style="margin: 24px 0;"><a href="index.html" style="font-size: 32px; font-weight: 600; color: #f0f0f0; text-decoration: none; transition: color 0.3s ease; letter-spacing: -0.5px;">Hover Animations</a></li>
    <li style="margin: 24px 0;"><a href="load-in-animations.html" style="font-size: 32px; font-weight: 600; color: #f0f0f0; text-decoration: none; transition: color 0.3s ease; letter-spacing: -0.5px;">Load In Animations</a></li>
    <li style="margin: 24px 0;"><a href="single-animation.html" style="font-size: 32px; font-weight: 600; color: #f0f0f0; text-decoration: none; transition: color 0.3s ease; letter-spacing: -0.5px;">Single Animation Test</a></li>
  </ul>
</div>

<div class="container">
  <h1 id="headline">Simple Fade Up Animation</h1>
  <p id="description">This page tests a basic GSAP animation. Watch the headline fade up from below.</p>
  <button id="animate-btn">Animate Again</button>
</div>

<div class="status">
  GSAP v3.14.2 - Simple Test
</div>

<script>
// Hamburger Menu
const hamburgerBtn = document.getElementById('hamburger-btn');
const menuOverlay = document.getElementById('menu-overlay');

hamburgerBtn.addEventListener('click', () => {
  hamburgerBtn.classList.toggle('active');
  menuOverlay.classList.toggle('active');
});

// Close menu when a link is clicked
menuOverlay.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  });
});

// Close menu when clicking outside (on the overlay itself)
menuOverlay.addEventListener('click', (e) => {
  if (e.target === menuOverlay) {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  }
});

// Animation test
const headline = document.getElementById('headline');
const description = document.getElementById('description');
const button = document.getElementById('animate-btn');

function runAnimation() {
  // Kill any existing animations
  gsap.killTweensOf([headline, description]);

  // Set initial state - use larger offset for visibility
  gsap.set([headline, description], { opacity: 0, y: 50 });

  // Create timeline and animate
  const tl = gsap.timeline();
  tl.to(headline, { opacity: 1, y: 0, duration: 1, ease: 'power2.out' }, 0)
    .to(description, { opacity: 1, y: 0, duration: 1, ease: 'power2.out' }, 0.3);
}

// Run animation on page load
runAnimation();

// Run animation on button click
button.addEventListener('click', runAnimation);

// Log to console for debugging
console.log('GSAP loaded:', typeof gsap !== 'undefined');
console.log('GSAP version:', gsap.version);
</script>

</body>
</html>
