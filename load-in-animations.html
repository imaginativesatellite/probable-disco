<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load In Animations | Lunamations</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --accent3: #43e97b;
      --headline-color: #ffcb05;
      --hover-color: #f26522;
      --radius: 12px;
      --card-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 24px;
      padding-top: 120px;
    }

    .header-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 96px;
      z-index: 10;
      pointer-events: none;
    }

    .hamburger-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 1001;
      transition: all 0.3s ease;
      padding: 0;
    }

    .hamburger-btn:hover {
      opacity: 0.8;
    }

    .hamburger-btn span {
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 1px;
      transition: all 0.3s ease;
      display: block;
      transform-origin: center;
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: rotate(45deg) translateY(11px);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: rotate(-45deg) translateY(-11px);
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 14, 14, 0.98);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-overlay.active {
      display: flex;
      opacity: 1;
    }

    .menu-overlay ul {
      list-style: none;
      text-align: center;
    }

    .menu-overlay li {
      margin: 24px 0;
    }

    .menu-overlay a {
      font-size: 32px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: color 0.3s ease;
      letter-spacing: -0.5px;
    }

    .menu-overlay a:hover {
      color: var(--accent);
    }

    .logo {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
      text-decoration: none;
      height: 48px;
      display: flex;
      align-items: center;
    }

    .slideshow-container {
      max-width: 800px;
      margin: 0;
    }

    .slideshow-container h1 {
      font-size: clamp(42px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .slideshow-container h2 {
      font-size: 20px;
      font-weight: 500;
      color: var(--headline-color);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .slideshow-container p {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 48px;
      line-height: 1.6;
      max-width: 600px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .slide-btn {
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.01em;
    }

    #reload-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      flex-shrink: 0;
      font-size: 20px;
    }

    .slide-btn:hover {
      background: var(--surface);
      border-color: var(--hover-color);
      color: var(--hover-color);
    }

    .slide-btn:active {
      transform: scale(0.98);
    }

    .slide-counter {
      position: fixed;
      bottom: 24px;
      right: 24px;
      color: var(--text-muted);
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body>

<!-- Logo -->
<a href="index.html" class="logo">LUNAMATIONS</a>

<!-- Hamburger Menu Button -->
<button class="hamburger-btn" id="hamburger-btn">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Full-Screen Menu Overlay -->
<div class="menu-overlay" id="menu-overlay">
  <ul>
    <li><a href="index.html">Hover Animations</a></li>
    <li><a href="load-in-animations.html">Load In Animations</a></li>
  </ul>
</div>

<!-- Slideshow Content -->
<div class="slideshow-container">
  <h1 id="headline">GSAP animations make everything look beautiful.</h1>
  <h2 id="subheadline">Fade In</h2>
  <p id="description">Elements smoothly fade in from transparent to fully opaque. This is the most basic and commonly used load-in animation, perfect for introducing content without distraction.</p>

  <div class="button-group">
    <button class="slide-btn" id="reload-btn">↻</button>
    <button class="slide-btn" id="prev-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Previous
    </button>
    <button class="slide-btn" id="next-btn">
      Next
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>

<span class="slide-counter"><span id="current-slide">1</span> / <span id="total-slides">3</span></span>
</div>

<script>
// Hamburger Menu
const hamburgerBtn = document.getElementById('hamburger-btn');
const menuOverlay = document.getElementById('menu-overlay');

hamburgerBtn.addEventListener('click', () => {
  hamburgerBtn.classList.toggle('active');
  menuOverlay.classList.toggle('active');
});

// Close menu when a link is clicked
menuOverlay.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  });
});

// Close menu when clicking outside (on the overlay itself)
menuOverlay.addEventListener('click', (e) => {
  if (e.target === menuOverlay) {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  }
});

// Slideshow Functionality
const animations = [
  {
    name: 'Fade In',
    description: 'Elements smoothly fade in from transparent to fully opaque. This is the most basic and commonly used load-in animation, perfect for introducing content without distraction.'
  },
  {
    name: 'Slide In Left',
    description: 'Content slides in from the left side of the screen, creating a sense of movement and direction. Great for guiding the viewer\'s eye across the page.'
  },
  {
    name: 'Scale Up',
    description: 'Elements start small and grow to their full size. This creates a sense of importance and draws attention to key content on the page.'
  }
];

let currentIndex = 0;

const headlineEl = document.getElementById('headline');
const subheadlineEl = document.getElementById('subheadline');
const descriptionEl = document.getElementById('description');
const currentSlideEl = document.getElementById('current-slide');
const totalSlidesEl = document.getElementById('total-slides');

const reloadBtn = document.getElementById('reload-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// Update slideshow display
function updateSlideshow() {
  const animation = animations[currentIndex];
  subheadlineEl.textContent = animation.name;
  descriptionEl.textContent = animation.description;
  currentSlideEl.textContent = currentIndex + 1;
  totalSlidesEl.textContent = animations.length;
}

// Button event listeners
reloadBtn.addEventListener('click', () => {
  updateSlideshow();
  console.log('Reloading animation:', animations[currentIndex].headline);
});

prevBtn.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + animations.length) % animations.length;
  updateSlideshow();
});

nextBtn.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % animations.length;
  updateSlideshow();
});

// Initialize
updateSlideshow();
</script>

</body>
</html>
