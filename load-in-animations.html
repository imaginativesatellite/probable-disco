<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Load In Animations | Lunamations</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #6c63ff;
      --accent2: #ff6b6b;
      --accent3: #43e97b;
      --radius: 12px;
      --card-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .header-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 96px;
      z-index: 10;
      pointer-events: none;
    }

    .hamburger-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 1001;
      transition: all 0.3s ease;
      padding: 0;
    }

    .hamburger-btn:hover {
      opacity: 0.8;
    }

    .hamburger-btn span {
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 1px;
      transition: all 0.3s ease;
      display: block;
      transform-origin: center;
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: rotate(45deg) translateY(11px);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: rotate(-45deg) translateY(-11px);
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 14, 14, 0.98);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .menu-overlay.active {
      display: flex;
      opacity: 1;
    }

    .menu-overlay ul {
      list-style: none;
      text-align: center;
    }

    .menu-overlay li {
      margin: 24px 0;
    }

    .menu-overlay a {
      font-size: 32px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: color 0.3s ease;
      letter-spacing: -0.5px;
    }

    .menu-overlay a:hover {
      color: var(--accent);
    }

    .logo {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
      text-decoration: none;
      height: 48px;
      display: flex;
      align-items: center;
    }

    .coming-soon {
      text-align: center;
      max-width: 600px;
    }

    .coming-soon h1 {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .coming-soon p {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      padding: 12px 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .back-link:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

<!-- Logo -->
<a href="index.html" class="logo">LUNAMATIONS</a>

<!-- Hamburger Menu Button -->
<button class="hamburger-btn" id="hamburger-btn">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Full-Screen Menu Overlay -->
<div class="menu-overlay" id="menu-overlay">
  <ul>
    <li><a href="index.html">Hover Animations</a></li>
    <li><a href="load-in-animations.html">Load In Animations</a></li>
  </ul>
</div>

<!-- Coming Soon Content -->
<div class="coming-soon">
  <h1>Load In Animations</h1>
  <p>Discover animation patterns that trigger when elements load into view. Coming soon.</p>
  <a href="index.html" class="back-link">← Back to Hover Animations</a>
</div>

<script>
// Hamburger Menu
const hamburgerBtn = document.getElementById('hamburger-btn');
const menuOverlay = document.getElementById('menu-overlay');

hamburgerBtn.addEventListener('click', () => {
  hamburgerBtn.classList.toggle('active');
  menuOverlay.classList.toggle('active');
});

// Close menu when a link is clicked
menuOverlay.querySelectorAll('a').forEach(link => {
  link.addEventListener('click', () => {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  });
});

// Close menu when clicking outside (on the overlay itself)
menuOverlay.addEventListener('click', (e) => {
  if (e.target === menuOverlay) {
    hamburgerBtn.classList.remove('active');
    menuOverlay.classList.remove('active');
  }
});
</script>

</body>
</html>
